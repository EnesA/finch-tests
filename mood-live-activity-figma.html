<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Finch — Mood Check-in Live Activity</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Rubik',-apple-system,sans-serif;
    background:#ece9f4;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;min-height:100vh;padding:16px 8px;overflow:hidden;
  }
  .stage-wrap{position:relative;}
  .stage{
    width:375px;height:812px;
    position:relative;overflow:hidden;border-radius:44px;
    box-shadow:0 24px 60px rgba(20,50,60,.4), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    transform-origin:top center;
    user-select:none;
  }

  /* ---------- recreated lock screen (teal ocean dusk) ---------- */
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;}
  /* ---------- live activity card — exact Figma geometry ---------- */
  .dim{position:absolute;inset:0;background:rgba(8,14,18,.45);opacity:0;transition:opacity .5s;pointer-events:none;z-index:20;}
  .dim.show{opacity:1;}
  .la-wrap{
    position:absolute;left:14px;top:473px;width:347px;height:139px;
    transform:translateY(-16px);opacity:0;pointer-events:none;
    transition:transform .5s cubic-bezier(.3,.9,.35,1.1), opacity .4s;
    z-index:30;
  }
  .la-wrap.show{transform:translateY(0);opacity:1;pointer-events:auto;}
  .la-wrap.leave{transform:translateY(-24px) scale(.94);opacity:0;pointer-events:none;
    transition:transform .45s cubic-bezier(.5,0,.8,.4), opacity .4s;}
  .la{
    position:absolute;inset:0;
    background:#eaf6ea; /* surface/accenttint */
    border-radius:20px;overflow:hidden;
    box-shadow:0 8px 28px rgba(10,40,35,.3);
  }
  .prompt{position:absolute;inset:0;transform-origin:center;
    opacity:1;filter:blur(0);transform:scale(1);
    transition:opacity .28s ease, filter .28s ease, transform .28s cubic-bezier(.4,0,.6,1);}
  .la.is-logged .prompt{opacity:0;filter:blur(10px);transform:scale(.9);pointer-events:none;}

  .answer{position:absolute;inset:0;transform-origin:center;pointer-events:none;
    transform:scale(.9);
    transition:transform .34s cubic-bezier(.3,.8,.4,1) .05s;}
  .la.is-logged .answer{transform:scale(1);pointer-events:auto;}

  /* children materialise in place — icon resolves a beat before the text */
  .answer .icon-clone,.answer b,.answer span,.answer .undo{
    opacity:0;filter:blur(10px);
    transition:opacity .3s ease, filter .3s ease;}
  .answer .icon-clone{transition-delay:.05s;}
  .answer b,.answer span{transition-delay:.13s;}
  .answer .undo{transition-delay:.18s;}
  .la.is-logged .answer .icon-clone,
  .la.is-logged .answer b,
  .la.is-logged .answer span{opacity:1;filter:blur(0);}
  .la.is-logged .answer .undo{opacity:.4;filter:blur(0);}
  .la h2{
    position:absolute;top:25px;left:0;right:0;
    font-size:18px;font-weight:500;color:#313131; /* text/primary */
    text-align:center;
  }
  /* nest app badge (recreated) */
  .badge{position:absolute;left:314px;top:13px;width:20px;height:20px;}
  .badge svg{display:block;width:100%;height:100%;}

  .mood{
    position:absolute;top:61px;width:48px;height:48px;
    background:none;border:none;cursor:pointer;padding:0;
    transition:transform .15s;
  }
  .mood:active{transform:scale(.85);}
  .mood svg,.icon-clone svg{display:block;width:100%;height:100%;}

  .logged{position:absolute;inset:0;}
  .logged .icon-clone{position:absolute;left:110px;top:38px;width:48px;height:48px;}
  .logged b{position:absolute;left:167px;top:41px;font-size:18px;font-weight:500;color:#313131;letter-spacing:-0.2px;}
  .logged span{position:absolute;left:167px;top:63px;font-size:18px;font-weight:500;}
  .undo{
    position:absolute;left:50%;transform:translateX(-50%);top:99px;
    background:none;border:none;color:#313131;
    font-family:inherit;font-size:14px;font-weight:500;
    padding:2px 6px;cursor:pointer;display:flex;
    align-items:center;gap:5px;
  }
  .undo .ic{width:18px;height:18px;transform:scaleX(-1);}
  .undo:active{opacity:.65;}


  .controls{display:flex;gap:10px;justify-content:center;}
  .controls button{
    font-family:inherit;font-size:14px;font-weight:600;
    padding:10px 20px;border-radius:100px;border:none;cursor:pointer;
    background:#5faf68;color:#fff;box-shadow:0 4px 14px rgba(60,140,80,.35);
  }
  .controls button.secondary{background:#fff;color:#444;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .hint{font-size:12px;color:#7a7490;text-align:center;max-width:430px;line-height:1.5;}
</style>
</head>

<script>
/* moods: exact Figma order + geometry (48px, top 61px) */
const PROMPT_BG = "#eaf6ea";
const MOODS = [
  {id:"bad",   left:33,  label:"Bad",   accent:"#6d4fc0", tint:"#f2eefc"},
  {id:"meh",   left:91,  label:"Meh",   accent:"#5b64a8", tint:"#eff0f9"},
  {id:"ok",    left:149, label:"Okay",  accent:"#007cbb", tint:"#ebf3f9"},
  {id:"good",  left:207, label:"Good",  accent:"#9c7a00", tint:"#fdf6e2"},
  {id:"great", left:265, label:"Great", accent:"#b36a00", tint:"#fdf2e3"},
];
const svgOf = id => document.getElementById("svg-"+id).innerHTML;

const laCard = document.getElementById("laCard");
const promptLayer = document.getElementById("promptLayer");
const loggedRow = document.getElementById("loggedRow");
MOODS.forEach(m=>{
  const b = document.createElement("button");
  b.className = "mood";
  b.style.left = m.left + "px";
  b.setAttribute("aria-label", m.label);
  b.innerHTML = svgOf(m.id);
  b.addEventListener("click", ()=>logMood(m));
  promptLayer.appendChild(b);
});

const laWrap = document.getElementById("laWrap");
const undoBtn = document.getElementById("undoBtn");
const dim = document.getElementById("dim");

let dismissTimer=null, expireTimer=null;
const WINDOW_SECONDS = 30;   // demo stand-in for a 30–60 min real window
const DISMISS_AFTER  = 3000;

function startWindow(){
  clearTimeout(expireTimer);
  expireTimer = setTimeout(expire, WINDOW_SECONDS*1000);
}

function trigger(){
  reset();
  laWrap.classList.remove("leave");
  laWrap.classList.add("show");
  dim.classList.add("show");
  startWindow();
}

function logMood(m){
  clearTimeout(expireTimer);
  loggedRow.innerHTML =
    `<div class="icon-clone">${svgOf(m.id)}</div>
     <b>Logged!</b><span style="color:${m.accent}">${m.label}</span>`;
  laCard.style.background = m.tint;
  void laCard.offsetWidth; /* commit initial styles so the crossfade runs */
  laCard.classList.add("is-logged");
  dismissTimer = setTimeout(()=>dismiss(m), DISMISS_AFTER);
}

undoBtn.addEventListener("click", ()=>{
  clearTimeout(dismissTimer);
  laCard.classList.remove("is-logged");
  laCard.style.background = PROMPT_BG;
  startWindow();
});

function dismiss(m){
  laWrap.classList.add("leave");laWrap.classList.remove("show");
  dim.classList.remove("show");
  setTimeout(()=>{laCard.classList.remove("is-logged");laCard.style.background=PROMPT_BG;}, 600);
}

function expire(){
  laWrap.classList.add("leave");laWrap.classList.remove("show");
  dim.classList.remove("show");
}

function reset(){
  clearTimeout(dismissTimer);clearTimeout(expireTimer);
  laCard.classList.remove("is-logged");
  laCard.style.background = PROMPT_BG;
  laWrap.classList.remove("show","leave");
  dim.classList.remove("show");
}

document.getElementById("triggerBtn").addEventListener("click", trigger);
document.getElementById("resetBtn").addEventListener("click", reset);

/* scale stage to viewport */
function fit(){
  const stage = document.getElementById("stage");
  const availH = window.innerHeight - 150;
  const availW = window.innerWidth - 24;
  const s = Math.min(availW/375, availH/812, 1);
  stage.style.transform = `scale(${s})`;
  stage.parentElement.style.width = 375*s + "px";
  stage.parentElement.style.height = 812*s + "px";
}
window.addEventListener("resize", fit); fit();

setTimeout(trigger, 700);
</script>
